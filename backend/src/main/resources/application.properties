spring.application.name=lankastay-backend

# Load local development secrets when Maven is run directly from backend/.
# OS environment variables still take precedence; the optional import is not packaged into the application.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lankastay_db}
spring.datasource.username=${DB_USER:${DB_USERNAME:lankastay_app}}
# Fail clearly when no database password is configured instead of attempting passwordless MySQL authentication.
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3

# Security: Spring MVC DEBUG logging must not render authentication bodies or CSRF tokens.
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO

server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.name=LANKASTAY_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# Security: credentialed browser sessions require an explicit trusted-origin list.
lankastay.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:5173}
lankastay.security.bootstrap-admin-email=${INITIAL_MANAGER_EMAIL:${BOOTSTRAP_ADMIN_EMAIL:}}
lankastay.security.bootstrap-admin-temp-password=${INITIAL_MANAGER_PASSWORD:${BOOTSTRAP_ADMIN_TEMP_PASSWORD:}}
lankastay.security.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
lankastay.security.lockout-duration=${AUTH_LOCKOUT_DURATION:15m}
lankastay.security.ip-max-attempts=${AUTH_IP_MAX_ATTEMPTS:20}
lankastay.security.ip-window=${AUTH_IP_WINDOW:15m}

# Multipart Upload Configuration (5 MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Reset emails use SMTP outside the explicit dev profile. No public link lookup exists.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
lankastay.frontend-url=${FRONTEND_URL:http://localhost:5174}
lankastay.mail.from=${MAIL_FROM:noreply@lankastay.local}

# Explicit development/demo opt-in; never enabled by the normal launcher.
lankastay.demo.seed-completed-reservation=${LANKASTAY_DEMO_SEED_COMPLETED_RESERVATION:false}
